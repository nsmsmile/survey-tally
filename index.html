<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-HwnydWF68ZaUG8pZnSzjjS770GU2YtCNkT5mpSJ3Oas=' 'sha256-7OaUfYyRffbdZIBZTEFloR2Jn7YbXMhBLUQGZS4rJSo='; style-src 'sha256-4lh3DN1bZ9VQ9LB/4GNB9MAp3DbXwYBF3d/AEwFkXfc='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>설문 집계기</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1d1f23;
  --muted: #5d636d;
  --line: #d5d9e0;
  --head: #f2f4f7;
  --accent: #1f5fbf;
  --warn: #9a4b00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181c;
    --fg: #e7e9ee;
    --muted: #a2a8b3;
    --line: #3a3f48;
    --head: #22262c;
    --accent: #7fb0ff;
    --warn: #f0b36b;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  line-height: 1.5;
}
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.125rem; margin: 28px 0 8px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); font-size: 0.9rem; }
label { display: block; font-weight: 600; margin: 20px 0 6px; }
textarea {
  width: 100%;
  min-height: 200px;
  padding: 10px;
  font: 0.9rem/1.4 ui-monospace, SFMono-Regular, Consolas, "D2Coding", monospace;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  resize: vertical;
  tab-size: 8;
}
textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
button {
  font: inherit;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--head);
  color: var(--fg);
  cursor: pointer;
}
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: right; vertical-align: top; }
th { background: var(--head); font-weight: 600; }
th:first-child, td:first-child { text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
#status { min-height: 1.5em; }
#status.warn { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>설문 집계기</h1>
  <p class="muted">붙여넣은 데이터는 이 브라우저 안에서만 계산하며, 어디로도 보내거나 저장하지 않습니다.</p>

  <label for="input">엑셀에서 머리글 줄까지 복사해 붙여넣으세요</label>
  <textarea id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" wrap="off"
    placeholder="응답번호&#9;문항1&#9;문항2&#10;1&#9;5&#9;3&#10;2&#9;4&#9;"></textarea>
  <div class="actions">
    <button type="button" id="clear">지우기</button>
    <span class="muted">첫 열(응답번호)은 집계하지 않습니다. 1~5만 유효, 빈칸은 빈 응답, 그 밖의 값은 제외로 셉니다.</span>
  </div>

  <h2>결과</h2>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="table-wrap">
    <table id="result" hidden>
      <thead>
        <tr><th scope="col">문항</th><th scope="col">유효 응답</th><th scope="col">평균</th><th scope="col">빈 응답</th><th scope="col">제외</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script id="tally-core">
// 계산 로직: 화면(DOM)과 무관한 순수 함수만 둔다. tests/tally.test.mjs가 이 블록만 꺼내 시험한다.
(function (root) {
  "use strict";

  // 엑셀에서 복사한 탭 구분 글을 줄·칸 배열로 바꾼다.
  // 엑셀은 줄바꿈이나 탭이 든 칸을 "…"로 감싸고 안의 "를 ""로 적으므로 그 경우만 풀어 읽는다.
  // 길이가 0인 줄은 응답 줄로 치지 않는다.
  function parseTsv(text) {
    const s = String(text);
    const rows = [];
    let row = [];
    let i = 0;
    let lineStart = 0;

    function endRow(lineIsEmpty) {
      if (!lineIsEmpty) rows.push(row);
      row = [];
    }

    while (i <= s.length) {
      if (i === s.length) {
        if (i > lineStart) endRow(false);
        break;
      }
      // 칸 하나 읽기
      let value = null;
      if (s[i] === '"') {
        const q = readQuoted(s, i);
        if (q) {
          value = q.value;
          i = q.end;
        }
      }
      if (value === null) {
        let j = i;
        while (j < s.length && s[j] !== "\t" && s[j] !== "\n" && s[j] !== "\r") j++;
        value = s.slice(i, j);
        i = j;
      }
      row.push(value);

      if (i >= s.length) {
        endRow(false);
        break;
      }
      if (s[i] === "\t") {
        i++;
        if (i === s.length) {
          row.push("");
          endRow(false);
          break;
        }
        continue;
      }
      // 줄바꿈
      const lineIsEmpty = i === lineStart;
      if (s[i] === "\r" && s[i + 1] === "\n") i += 2;
      else i++;
      endRow(lineIsEmpty);
      lineStart = i;
    }
    return rows;
  }

  // start 위치의 "로 시작하는 엑셀식 따옴표 칸을 읽는다.
  // 닫는 따옴표 뒤가 탭·줄바꿈·끝이고, 안에 줄바꿈이나 탭이 있을 때만 따옴표 칸으로 본다
  // (엑셀은 그때만 따옴표로 감싼다). 아니면 null을 돌려주어 글자 그대로 읽게 한다.
  function readQuoted(s, start) {
    let i = start + 1;
    let out = "";
    while (i < s.length) {
      const c = s[i];
      if (c === '"') {
        if (s[i + 1] === '"') {
          out += '"';
          i += 2;
          continue;
        }
        const after = s[i + 1];
        const closesField = after === undefined || after === "\t" || after === "\n" || after === "\r";
        if (closesField && /[\t\r\n]/.test(out)) return { value: out, end: i + 1 };
        return null;
      }
      out += c;
      i++;
    }
    return null;
  }

  // 칸 판정: "valid" | "blank" | "excluded"
  function classifyCell(raw) {
    const v = raw === undefined || raw === null ? "" : String(raw).trim();
    if (v === "") return "blank";
    if (v === "1" || v === "2" || v === "3" || v === "4" || v === "5") return "valid";
    return "excluded";
  }

  // 평균 = sum ÷ count 를 소수 셋째 자리에서 반올림해 둘째 자리까지. count가 0이면 "-".
  // 부동소수점 오차를 피하려고 정수로만 계산한다.
  function formatAverage(sum, count) {
    if (!count) return "-";
    const hundredths = Math.floor((sum * 200 + count) / (2 * count));
    const whole = Math.floor(hundredths / 100);
    const frac = hundredths % 100;
    return whole + "." + (frac < 10 ? "0" : "") + frac;
  }

  // 붙여넣은 글 전체를 집계한다.
  function tally(text) {
    const rows = parseTsv(text);
    if (rows.length === 0) return { questions: [], responseCount: 0 };
    const header = rows[0];
    const body = rows.slice(1);
    const questions = [];
    for (let col = 1; col < header.length; col++) {
      const name = header[col].trim() || "열 " + (col + 1);
      let valid = 0;
      let sum = 0;
      let blank = 0;
      let excluded = 0;
      for (const r of body) {
        const kind = classifyCell(r[col]);
        if (kind === "valid") {
          valid++;
          sum += Number(r[col].trim());
        } else if (kind === "blank") {
          blank++;
        } else {
          excluded++;
        }
      }
      questions.push({ name, valid, average: formatAverage(sum, valid), blank, excluded });
    }
    return { questions, responseCount: body.length };
  }

  root.SurveyTally = { parseTsv, classifyCell, formatAverage, tally };
})(globalThis);
</script>
<script id="tally-ui">
// 화면: 입력을 받아 계산 로직에 넘기고 결과를 표로 그린다. 값은 textContent로만 넣는다.
(function () {
  "use strict";
  const input = document.getElementById("input");
  const clearBtn = document.getElementById("clear");
  const status = document.getElementById("status");
  const table = document.getElementById("result");
  const tbody = table.querySelector("tbody");

  function setStatus(text, warn) {
    status.textContent = text;
    status.classList.toggle("warn", Boolean(warn));
  }

  function render() {
    const text = input.value;
    tbody.replaceChildren();
    if (text.trim() === "") {
      table.hidden = true;
      setStatus("데이터를 붙여넣으면 결과가 여기에 나옵니다.");
      return;
    }
    const result = SurveyTally.tally(text);
    if (result.questions.length === 0) {
      table.hidden = true;
      setStatus("집계할 문항이 없습니다. 머리글 줄에 응답번호 열 뒤로 문항 열이 있는지, 칸이 탭으로 나뉘어 있는지 확인하세요.", true);
      return;
    }
    for (const q of result.questions) {
      const tr = document.createElement("tr");
      for (const value of [q.name, q.valid, q.average, q.blank, q.excluded]) {
        const td = document.createElement("td");
        td.textContent = String(value);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.hidden = false;
    setStatus("문항 " + result.questions.length + "개, 응답 " + result.responseCount + "줄");
  }

  input.addEventListener("input", render);
  clearBtn.addEventListener("click", function () {
    input.value = "";
    render();
    input.focus();
  });
  render();
})();
</script>
</body>
</html>
